name: Python Checks

on:
  push:
    branches: [main, develop]
    paths:
      - 'examples/python/**'
      - '.github/workflows/python-checks.yml'
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run dependency-free inspector tests
        working-directory: examples/python
        run: python -m unittest -v test_inspect_mesh.py
      - name: Verify CLI help
        run: python examples/python/inspect_mesh.py --help
