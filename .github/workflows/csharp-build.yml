name: C# Build & Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-csharp:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    
    - name: Restore dependencies
      run: |
        cd src/csharp
        dotnet restore
        dotnet restore GeometryKit/GeometryKit.csproj
        dotnet restore GeometryKit.Tests/GeometryKit.Tests.csproj
    
    - name: Build
      run: |
        cd src/csharp
        dotnet build --configuration Release --no-restore
        dotnet build GeometryKit/GeometryKit.csproj --configuration Release --no-restore
    
    - name: Run Tests
      run: |
        cd src/csharp/Tests
        dotnet test --configuration Release --verbosity normal
        cd ../GeometryKit.Tests
        dotnet test --configuration Release --verbosity normal
